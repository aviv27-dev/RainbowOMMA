name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the test suite (fakes only — no real browser or app)
        run: python3 tests/test_rainbowomma.py
      - name: Shell syntax
        run: for f in bin/*.sh install.sh uninstall.sh install/*.sh examples/agent-launcher.sh; do bash -n "$f"; done && for f in bin/browser-owner bin/port-owner bin/proc-owner bin/office-owner bin/as-agent bin/receipts bin/rainbowomma-doctor bin/rainbowomma-pause bin/rainbowomma-menubar bin/screen-owner bin/rainbowomma-approve bin/rainbowomma-session-end bin/rainbowomma-mcp bin/agent-office bin/cua-color-proxy bin/rainbowomma-guard examples/agent-shortcut adapters/cline/PreToolUse; do bash -n "$f"; done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff and shellcheck
        run: python3 -m pip install --quiet ruff shellcheck-py
      - name: Python — real errors only (undefined names, unused imports, syntax)
        run: ruff check --select F,E9 bin tools tests install
      - name: Shell — warnings and errors
        run: shellcheck -S warning bin/*.sh install.sh uninstall.sh install/*.sh examples/agent-launcher.sh examples/agent-shortcut adapters/cline/PreToolUse bin/browser-owner bin/port-owner bin/proc-owner bin/office-owner bin/agent-office bin/as-agent bin/receipts bin/rainbowomma-doctor bin/rainbowomma-pause bin/rainbowomma-menubar bin/screen-owner bin/rainbowomma-approve bin/rainbowomma-guard bin/rainbowomma-session-end bin/rainbowomma-mcp bin/cua-color-proxy
