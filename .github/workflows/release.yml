name: release

# A release from a pushed v* tag, or from the Actions tab: "Run workflow" with a version (it creates the tag on main).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (needs a section in CHANGELOG.md)"
        required: true

permissions: {}

jobs:
  release:
    # only from main, or a v* tag that main contains
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write          # creating the release; the token is handed only to that step
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned by commit (a tag can be moved)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main — no release" >&2; exit 1; }
      - name: Test before releasing
        run: python3 tests/test_rainbowomma.py
      - name: Which version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a version: $v" >&2; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
      - name: Create the GitHub release (and its tag, when run by hand)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION is already released"; exit 0; fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "RainbowOMMA v$VERSION" --notes-file notes.md
